appId: org.wl2go.app
productName: WL2GO
copyright: WL2GO contributors

directories:
  output: release

# Main and preload are bundled by electron-vite and the renderer inlines React,
# so almost nothing from node_modules is needed. serialport is the exception:
# it has a native binding that cannot be bundled, so its package tree ships.
# electron-builder never copies devDependencies, so this stays small.
files:
  - out/**/*
  - package.json
  - node_modules/**/*

# Native .node files cannot be dlopen'd from inside an asar archive -- the same
# constraint that puts the spawned binaries in extraResources.
asarUnpack:
  - "**/*.node"

# Subprocess binaries must land on the real filesystem, NOT inside app.asar --
# child_process.spawn() cannot exec a path inside an asar archive.
# This maps to process.resourcesPath/bin/<platform>/<arch>/<binary>, which is
# what resolveBinaryPath() expects at runtime. Each platform ships only its own
# binaries; bundling the whole tree would drag every other platform's builds
# into the package.
extraResources:
  - from: resources/bin/PAT_VERSION
    to: bin/PAT_VERSION
  - from: resources/bin/ARDOPCF_VERSION
    to: bin/ARDOPCF_VERSION
  - from: resources/bin/RIGCTLD_VERSION
    to: bin/RIGCTLD_VERSION
  # Generated by scripts/collect-licenses.mjs: WL2GO's license, every bundled
  # component's notice, and Chromium's. Required to redistribute the binaries.
  - from: resources/licenses
    to: licenses

asar: true

# Electron's defaults leave the packaged app usable as a general-purpose Node
# interpreter (ELECTRON_RUN_AS_NODE, NODE_OPTIONS, --inspect), and macOS credits
# whatever runs that way with WL2GO's microphone permission. Asar integrity and
# asar-only loading mean a tampered or side-loaded app/ directory is refused.
# grantFileProtocolExtraPrivileges stays on: the renderer loads from file://
# as module scripts, and turning it off is untested.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

mac:
  category: public.app-category.utilities
  target:
    - dir
  # Without this string macOS denies microphone access to ardopcf outright, and
  # the denial is silent: the modem receives zeroes and every session fails to
  # decode with nothing naming the cause. TCC attributes a spawned helper to its
  # responsible process -- the app bundle -- so this one entry covers the child
  # binary too. Module 11 adds com.apple.security.device.audio-input alongside
  # it, which the hardened runtime requires and an ad-hoc signature does not.
  extendInfo:
    NSMicrophoneUsageDescription: >-
      WL2GO uses your radio's audio interface to send and receive Winlink
      messages over the air. It never records or transmits audio anywhere else.
  extraResources:
    - from: resources/bin/PAT_VERSION
      to: bin/PAT_VERSION
    - from: resources/bin/ARDOPCF_VERSION
      to: bin/ARDOPCF_VERSION
    - from: resources/bin/RIGCTLD_VERSION
      to: bin/RIGCTLD_VERSION
    - from: resources/licenses
      to: licenses
    - from: resources/bin/darwin
      to: bin/darwin
      filter:
        - "**/*"
  # Developer ID signing and notarization are Module 11. scripts/pack-mac.sh
  # applies an ad-hoc signature afterwards, which Apple Silicon requires in
  # order to launch any executable at all.
  identity: null
